<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兴趣分配记录表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(180deg, #e8d5f5 0%, #f5d5e8 30%, #d5e8f5 60%, #e8d5f5 100%);
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
  min-height: 100vh;
}

.page {
  width: 1100px;
  max-width: 95vw;
  background: linear-gradient(180deg, #f0e0f8 0%, #fce4ec 25%, #e3f2fd 50%, #f3e5f5 75%, #fce4ec 100%);
  border-radius: 24px;
  padding: 30px 36px 40px;
  position: relative;
  border: 3px solid #d1a3d4;
  box-shadow: 0 0 30px rgba(200,150,220,0.3);
  overflow: hidden;
}

/* Decorative elements */
.deco-star { position: absolute; color: #ffd54f; font-size: 22px; opacity: 0.7; pointer-events: none; }
.deco-heart { position: absolute; color: #f48fb1; font-size: 18px; opacity: 0.6; pointer-events: none; }
.deco-clover { position: absolute; color: #81c784; font-size: 18px; opacity: 0.6; pointer-events: none; }
.sparkle {
  position: absolute; width: 6px; height: 6px;
  background: #ffd54f; border-radius: 50%;
  opacity: 0.5; box-shadow: 0 0 6px #ffd54f; pointer-events: none;
}

/* Title */
.title-area {
  text-align: center;
  margin-bottom: 24px;
  position: relative;
  z-index: 2;
}

.title-area h1 {
  font-size: 38px;
  font-weight: 900;
  background: linear-gradient(135deg, #9c27b0, #e91e63, #9c27b0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 8px;
  position: relative;
  display: inline-block;
}

.title-area h1::before { content: '♡ '; -webkit-text-fill-color: #f48fb1; }
.title-area h1::after { content: ' ♡'; -webkit-text-fill-color: #f48fb1; }

/* Section label */
.section-label {
  background: linear-gradient(135deg, #ef5350, #e91e63);
  color: white;
  font-size: 16px;
  font-weight: 700;
  padding: 6px 18px;
  border-radius: 8px;
  display: inline-block;
  margin-bottom: 10px;
  letter-spacing: 3px;
  box-shadow: 0 2px 8px rgba(233,30,99,0.3);
}

/* Table styles */
table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 28px;
  position: relative;
  z-index: 2;
  table-layout: fixed;
}

th, td {
  border: 1.5px solid #ce93d8;
  text-align: center;
  vertical-align: middle;
  font-size: 15px;
  padding: 8px 4px;
}

/* Category header colors */
.cat-tags { background: #bbdefb !important; color: #1565c0; font-weight: 700; font-size: 16px; letter-spacing: 2px; }
.cat-ideal { background: #fff9c4 !important; color: #f57f17; font-weight: 700; font-size: 16px; letter-spacing: 2px; }
.cat-truth { background: #c8e6c9 !important; color: #2e7d32; font-weight: 700; font-size: 16px; letter-spacing: 2px; }

/* Name sub-headers */
.name-blue { background: #e3f2fd !important; color: #1976d2; font-weight: 700; }
.name-yellow { background: #fffde7 !important; color: #f9a825; font-weight: 700; }
.name-green { background: #e8f5e9 !important; color: #388e3c; font-weight: 700; }

/* Row label (student names) */
.row-label {
  background: #fce4ec !important;
  color: #ad1457;
  font-weight: 700;
  font-size: 15px;
  width: 90px;
  letter-spacing: 1px;
}

/* Total row */
.total-row {
  background: #f3e5f5 !important;
  color: #6a1b9a;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 1px;
}

/* Editable data cells */
.data-cell {
  background: #ffffff !important;
  min-width: 50px;
  height: 42px;
  cursor: text;
  transition: all 0.2s ease;
  position: relative;
}

.data-cell:hover {
  background: #f8f0ff !important;
  box-shadow: inset 0 0 0 2px #ce93d8;
}

.data-cell:focus {
  outline: none;
  background: #fce4ec !important;
  box-shadow: inset 0 0 0 2px #e91e63;
}

.data-cell.has-value {
  color: #6a1b9a;
  font-weight: 700;
  font-size: 16px;
}

/* Total cell display */
.total-cell {
  background: #f3e5f5 !important;
  color: #6a1b9a;
  font-weight: 700;
  font-size: 16px;
  min-width: 50px;
  height: 42px;
}

/* Section wrapper */
.section {
  text-align: center;
  margin-bottom: 6px;
}

/* Export button */
.export-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: linear-gradient(135deg, #9c27b0, #e91e63);
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Noto Sans TC', sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(233,30,99,0.4);
  transition: all 0.3s ease;
  z-index: 1000;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.export-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(233,30,99,0.5);
}

.export-btn:active {
  transform: translateY(0);
}

.export-btn svg {
  width: 20px;
  height: 20px;
  fill: white;
}

/* Toast notification */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: linear-gradient(135deg, #4caf50, #66bb6a);
  color: white;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Noto Sans TC', sans-serif;
  box-shadow: 0 4px 20px rgba(76,175,80,0.4);
  z-index: 2000;
  transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  letter-spacing: 1px;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* Column width distribution */
table th:first-child,
table td:first-child {
  width: 90px;
}
</style>
</head>

<script>
// Handle input - only allow numbers, auto-calculate totals
document.querySelectorAll('.data-cell').forEach(cell => {
  cell.addEventListener('input', function(e) {
    // Only allow numbers
    let text = this.textContent.replace(/[^\d]/g, '');
    if (text.length > 2) text = text.slice(0, 2); // Max 2 digits
    this.textContent = text;
    
    // Update styling
    if (text) {
      this.classList.add('has-value');
    } else {
      this.classList.remove('has-value');
    }
    
    // Recalculate totals
    calculateTotals();
  });
  
  // Prevent paste of non-numeric content
  cell.addEventListener('paste', function(e) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    const num = text.replace(/[^\d]/g, '').slice(0, 2);
    if (num) {
      this.textContent = num;
      this.classList.add('has-value');
      calculateTotals();
    }
  });
  
  // Select all on focus
  cell.addEventListener('focus', function() {
    const range = document.createRange();
    range.selectNodeContents(this);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
});

// Calculate totals for both sections
function calculateTotals() {
  const categories = ['标签', '理想型', '三真一假'];
  
  // Male totals
  const maleTargets = ['晚晴', '以宁', '知柚', '星眠'];
  categories.forEach(cat => {
    maleTargets.forEach(target => {
      const cells = document.querySelectorAll(`#male-table .data-cell[data-col="${cat}-${target}"]`);
      let sum = 0;
      cells.forEach(cell => {
        const val = parseInt(cell.textContent);
        if (!isNaN(val)) sum += val;
      });
      const totalCell = document.getElementById(`male-total-${cat}-${target}`);
      if (totalCell) totalCell.textContent = sum;
    });
  });
  
  // Female totals
  const femaleTargets = ['叙白', '泽宇', '星辰', '亦帆'];
  categories.forEach(cat => {
    femaleTargets.forEach(target => {
      const cells = document.querySelectorAll(`#female-table .data-cell[data-col="${cat}-${target}"]`);
      let sum = 0;
      cells.forEach(cell => {
        const val = parseInt(cell.textContent);
        if (!isNaN(val)) sum += val;
      });
      const totalCell = document.getElementById(`female-total-${cat}-${target}`);
      if (totalCell) totalCell.textContent = sum;
    });
  });
}

// Export as image
function exportData() {
  // Hide export button temporarily
  const exportBtn = document.querySelector('.export-btn');
  exportBtn.style.display = 'none';
  
  const page = document.getElementById('page');
  
  html2canvas(page, {
    backgroundColor: '#f0e0f8',
    scale: 2, // Higher quality
    logging: false,
    useCORS: true
  }).then(canvas => {
    // Convert canvas to blob
    canvas.toBlob(blob => {
      // Create download link
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', '兴趣分配记录表.png');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      // Show export button again
      exportBtn.style.display = 'flex';
      
      // Show toast
      showToast();
    }, 'image/png');
  }).catch(err => {
    console.error('Export failed:', err);
    exportBtn.style.display = 'flex';
    alert('导出失败，请重试');
  });
}

// Toast notification
function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}
</script>
